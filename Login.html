<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Gundam Dock</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <a href="./index.html" class="logo"><img src="./img/logo.svg" alt="Gunpla" /></a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm Gundam..." />
        <button onclick="search()">🔍</button>
      </div>
    </header>

    <nav>
      <div class="pill-bar">
        <a class="pill" href="./index.html">Home</a>
        <a class="pill" href="./AboutUs.html">About Us</a>
        <a class="pill" href="./Products.html">Products</a>
        <a class="pill" href="./Information.html">Information</a>
        <a class="pill" href="./Help.html">Help</a>
        <a class="pill" href="./Register.html">Register</a>
        <a class="pill" href="./Login.html">Login</a>
      </div>
    </nav>

    <main>
      <section class="form-wrap auth-wrap">
        <div class="form-box">
          <p class="auth-eyebrow">GUNDAM DOCK MEMBER</p>
          <h2>Đăng nhập</h2>
          <p class="auth-intro">
            Đăng nhập để tiếp tục khám phá bộ sưu tập Gundam.
          </p>
          <form id="loginForm" novalidate>
            <label for="username">Email</label>
            <input
              type="email"
              id="username"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              placeholder="Mật khẩu"
              required
            />
            <p
              id="msg"
              class="form-message"
              role="status"
              aria-live="polite"
            ></p>
            <button type="submit">Đăng nhập</button>
            <p class="auth-switch">
              Chưa có tài khoản? <a href="./Register.html">Đăng ký ngay</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Gundam Dock. All rights reserved.</p>
    </footer>
    <script src="./js/search.js" defer></script>
    <script src="./js/login.js" defer></script>
  </body>
</html>
