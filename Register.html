<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Gundam Dock</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <a href="./index.html" class="logo"><img src="./img/logo.svg" alt="Gunpla" /></a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm Gundam..." />
        <button onclick="search()">🔍</button>
      </div>
    </header>

    <nav>
      <div class="pill-bar">
        <a class="pill" href="./index.html">Home</a>
        <a class="pill" href="./AboutUs.html">About Us</a>
        <a class="pill" href="./Products.html">Products</a>
        <a class="pill" href="./Information.html">Information</a>
        <a class="pill" href="./Help.html">Help</a>
        <a class="pill" href="./Register.html">Register</a>
        <a class="pill" href="./Login.html">Login</a>
      </div>
    </nav>

    <main>
      <section class="form-wrap auth-wrap">
        <div class="form-box">
          <p class="auth-eyebrow">GUNDAM DOCK MEMBER</p>
          <h2>Tạo tài khoản</h2>
          <p class="auth-intro">Tham gia cộng đồng và lưu lại hành trình sưu tầm của bạn.</p>
          <form id="signupForm" novalidate>
            <label for="username">Email</label>
            <input type="email" id="username" placeholder="name@example.com" autocomplete="email" required />
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              placeholder="Đặt mật khẩu (ít nhất 8 ký tự)"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Nhập lại mật khẩu"
              required
              autocomplete="new-password"
            />
            <label for="birthday">Ngày sinh</label>
            <input type="date" id="birthday" required />
            <p id="msg" class="form-message" role="status" aria-live="polite"></p>
            <button type="submit">Tạo tài khoản</button>
            <p class="auth-switch">Đã có tài khoản? <a href="./Login.html">Đăng nhập</a></p>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Gundam Dock. All rights reserved.</p>
    </footer>

    <script src="./js/search.js" defer></script>
    <script src="./js/register.js" defer></script>
  </body>
</html>
